# Site-wide settings
# ------------------
#
# title: Your awesome title
#
# author:
#   name: GitHub User
#   email: your-email@domain.com
#
# The `>` after `description:` means to ignore line-breaks until next key. If
#   you wish to omit the line-break after the end of text, use `>-` instead.
# description: >
#   Write an awesome description for your new site here. You can edit this line
#   in _config.yml. It will appear in your document head meta (for Google search
#   results) and in your feed.xml site description.

title: ODIN Diagnostics
owner_name: John Mortensen
github_username: Open-Coding-Society
github_repo: "ODIN_Frontend"
baseurl: "/ODIN_Frontend" 
future: true

# The ODIN site's own settings, read by _projects/systems/odin.
odin:
  # Each page's address, by the name the backend gives the page. The backend sends every word a
  # visitor reads, the menu's included. This list only says where each page lives on this site,
  # so adding a page to the menu means one line here and a page file, with no HTML to edit.
  routes:
    home: "/"
    how_it_works: "/how-it-works/"
    about: "/about/"
    contact: "/contact/"
    not_found: "/404.html"

# What Jekyll leaves out of the built site. This repo began as the OCS portfolio template, which
# also holds the template's own pages, lessons, games and media. ODIN's site is its own pages
# (navigation/projects/odin), the stylesheet and the scripts, so the rest is not published.
# The files stay in the repo, untouched, so an upstream sync still applies. The first seven
# lines are Jekyll's own defaults, which a list here replaces.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Tooling and notes
  - venv
  - scripts
  - tests
  - Makefile
  - requirements.txt
  - Gemfile_Patch.rb
  - README.md
  - README4YML.md
  - LICENSE
  - _projects
